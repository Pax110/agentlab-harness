# Free checks on every push and pull request: no API key needed, no model calls.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate        # every task: buggy code fails, reference fix passes
      - run: npm run check-offline   # baselines: answer → apply → grade works for every task
